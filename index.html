<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マインドマップ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-50 text-slate-800 flex flex-col">
  <header class="flex flex-wrap items-center gap-2 px-4 py-2 bg-white border-b border-slate-200 shadow-sm z-10">
    <h1 class="text-base font-bold mr-4">マインドマップ</h1>

    <button id="new-map-btn" class="toolbar-icon-btn" title="新規作成" aria-label="新規作成">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="12" y1="10" x2="12" y2="16"/></svg>
    </button>
    <button id="open-btn" class="toolbar-icon-btn" title="ファイルを開く (yml)" aria-label="ファイルを開く">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button id="save-btn" class="toolbar-icon-btn" title="保存 (Ctrl+S)" aria-label="保存">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><path d="M7 21v-6h10v6"/></svg>
    </button>
    <button id="save-as-btn" class="toolbar-icon-btn" title="名前を付けて保存" aria-label="名前を付けて保存">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10l3 3v12H4z"/><path d="M7 4v4h6V4"/><path d="M6 20v-5h8v5"/><circle cx="18" cy="17" r="5" fill="white" stroke="currentColor"/><path d="M18 15v4M16 17h4"/></svg>
    </button>

    <span class="w-px h-6 bg-slate-200 mx-1"></span>

    <button id="undo-btn" class="toolbar-icon-btn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <button id="redo-btn" class="toolbar-icon-btn" title="やり直し (Ctrl+Shift+Z)" aria-label="やり直し">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a5 5 0 0 0 0 10h1"/></svg>
    </button>

    <span class="w-px h-6 bg-slate-200 mx-1"></span>

    <button id="add-child-btn" class="toolbar-icon-btn" title="子ノードを追加 (Enter)" aria-label="子ノードを追加">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2.5"/><line x1="7.5" y1="12" x2="14" y2="12"/><circle cx="18" cy="12" r="4.5"/><line x1="18" y1="9.5" x2="18" y2="14.5"/><line x1="15.5" y1="12" x2="20.5" y2="12"/></svg>
    </button>
    <button id="edit-btn" class="toolbar-icon-btn" title="選択中ノードを編集" aria-label="編集">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L15 6l4 4L9 20z"/><path d="M13 8l3 3"/></svg>
    </button>
    <button id="duplicate-btn" class="toolbar-icon-btn" title="ノードを複製 (Ctrl+D)" aria-label="複製">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="11" height="13" rx="1.5"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4H18a2 2 0 0 1 2 2v11a1.5 1.5 0 0 1-1.5 1.5H17"/></svg>
    </button>
    <button id="delete-btn" class="toolbar-icon-btn toolbar-btn-danger" title="ノードを削除 (Delete)" aria-label="削除">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </button>

    <div class="toolbar-btn flex items-center gap-2" title="選択中ノードの背景色">
      <span class="text-xs text-slate-500">背景色</span>
      <input id="bg-color-input" type="color" class="w-6 h-6 p-0 border-0 bg-transparent cursor-pointer" />
      <div id="bg-palette" class="flex items-center gap-1"></div>
    </div>
    <div class="toolbar-btn flex items-center gap-2" title="選択中ノードの文字色">
      <span class="text-xs text-slate-500">文字色</span>
      <input id="text-color-input" type="color" class="w-6 h-6 p-0 border-0 bg-transparent cursor-pointer" />
      <div id="text-palette" class="flex items-center gap-1"></div>
    </div>

    <span class="w-px h-6 bg-slate-200 mx-1"></span>

    <div class="toolbar-btn flex items-center gap-2">
      <input id="search-input" type="text" placeholder="ノードを検索 (Enter: 次へ)" class="outline-none bg-transparent text-sm w-36" />
      <span id="search-count" class="text-xs text-slate-500 whitespace-nowrap"></span>
    </div>

    <span id="status" class="ml-auto text-sm text-slate-500"></span>
  </header>

  <main id="viewport" class="relative flex-1 overflow-hidden bg-slate-100 cursor-grab active:cursor-grabbing">
    <div id="canvas-content" class="absolute top-0 left-0 origin-top-left">
      <svg id="connections" class="absolute overflow-visible pointer-events-none" width="1" height="1"></svg>
      <div id="nodes-layer" class="absolute top-0 left-0"></div>
    </div>
  </main>

  <style>
    .toolbar-btn {
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      border-radius: 0.5rem;
      background-color: #f1f5f9;
      color: #334155;
    }
    .toolbar-btn:hover {
      background-color: #e2e8f0;
    }
    .toolbar-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      background-color: #f1f5f9;
      color: #334155;
    }
    .toolbar-icon-btn:hover {
      background-color: #e2e8f0;
    }
    .toolbar-icon-btn svg {
      width: 1.25rem;
      height: 1.25rem;
    }
    .toolbar-btn-danger:hover {
      background-color: #fecaca;
      color: #991b1b;
    }
  </style>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
